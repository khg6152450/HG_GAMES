<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Puyo Puyo - 뿌요뿌요</title>
    <meta name="description" content="부모님을 위한 광고 없는 젤리 퍼즐 뿌요뿌요">
    
    <!-- PWA -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0f0c29">
    <link rel="apple-touch-icon" href="icon-192.png">
    
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="game-container">
        <!-- Title and Stats Header -->
        <div class="header">
            <h1>PUYO PUYO</h1>
        </div>

        <div class="game-layout">
            <!-- Left Info Panel -->
            <div class="side-panel">
                <div class="info-box">
                    <div class="info-label">점수</div>
                    <div id="score" class="info-value">0</div>
                </div>
                <div class="info-box">
                    <div class="info-label">최고 점수</div>
                    <div id="high-score" class="info-value">0</div>
                </div>
                <div class="info-box">
                    <div class="info-label">다음 뿌요</div>
                    <div class="next-preview">
                        <div id="next-puyo-container">
                            <!-- Injected by JS -->
                        </div>
                    </div>
                </div>
            </div>

            <!-- Game Board Wrapper -->
            <div class="board-wrapper">
                <div id="game-board">
                    <!-- Grid cells will be generated by JS -->
                </div>
                <!-- Dynamic Combo/Chain Banner -->
                <div id="combo-banner" class="combo-banner"></div>
            </div>
        </div>

        <!-- Virtual Controllers for Mobile -->
        <div class="controller">
            <div class="dpad">
                <button id="btn-left" class="control-btn" title="왼쪽 이동">◀</button>
                <button id="btn-down" class="control-btn" title="빠르게 내리기">▼</button>
                <button id="btn-right" class="control-btn" title="오른쪽 이동">▶</button>
            </div>
            <div class="actions">
                <button id="btn-rotate-ccw" class="control-btn action-btn" title="반시계 회전">↺</button>
                <button id="btn-rotate-cw" class="control-btn action-btn" title="시계 회전">↻</button>
            </div>
        </div>

        <!-- Bottom Options -->
        <div class="options">
            <button class="option-btn" onclick="showMenu()">메뉴</button>
            <button class="option-btn" onclick="resetGame()">다시 시작</button>
        </div>
    </div>

    <!-- Starting Menu Overlay -->
    <div id="menu-overlay" class="overlay active">
        <h2>뿌요뿌요</h2>
        <p class="menu-desc">4개 이상의 같은 색깔 젤리가 모이면 터집니다!</p>
        <button class="start-btn" onclick="startGame()">게임 시작</button>
    </div>

    <!-- Win/Game Over Overlay -->
    <div id="gameover-overlay" class="overlay">
        <h2>게임 오버</h2>
        <div class="final-score-box">
            <div class="info-label">최종 점수</div>
            <div id="final-score" class="info-value">0</div>
        </div>
        <button class="start-btn" onclick="startGame()">다시 시작</button>
    </div>

    <script src="game.js"></script>
    <script>
        // PWA Service Worker Registration
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Puyo SW registered'))
                    .catch(err => console.log('Puyo SW failed', err));
            });
        }
    </script>
</body>
</html>
